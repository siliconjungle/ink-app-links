<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Links · Ink</title><link rel="stylesheet" href="./styles/ink.css"><link rel="stylesheet" href="./app.css"></head><body><div id="app">
<header><div class="brand"><span class="brand-icon" aria-hidden="true"></span><strong>Links</strong></div><span id="sync" role="status">Connecting…</span><button id="retry" hidden>Reconnect</button></header>
<section class="add-section"><form id="add-form"><label class="sr-only" for="url">Link address</label><div class="url-input"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 7-1 1a4.24 4.24 0 0 1-6-6l4-4a4.24 4.24 0 0 1 6 0m2 1 1-1a4.24 4.24 0 0 1 6 6l-4 4a4.24 4.24 0 0 1-6 0"/></svg><input id="url" type="text" inputmode="url" autocomplete="url" placeholder="Paste a link to save…" required maxlength="4096" disabled></div><button id="save" class="primary" disabled>＋ Save link</button></form><p id="add-help">Images, titles and descriptions, saved together.</p></section>
<div class="toolbar"><div><span id="count">0 links</span><span class="divider">·</span><span id="arrange-hint">Drag cards to arrange</span></div><input id="search" type="search" aria-label="Search saved links" placeholder="Search links…"></div>
<div id="notice" role="status" hidden><span></span><button id="undo" hidden>Undo</button><button id="dismiss" aria-label="Dismiss message">×</button></div>
<main id="scroll"><div id="empty" class="empty"><span class="empty-icon" aria-hidden="true"></span><h1>Keep the good links.</h1><p>Paste a URL above. We’ll find the image,<br>title and description for you.</p></div><div id="cards" role="list" aria-label="Saved links"></div></main>
</div><script type="module" src="./app.mjs"></script></body></html>
